name: Kubernetes helm deployment with github action extensions ===> plugins

on:
  push:
    branches:
      - main

env:
  IMAGE_REPOSITORY: 517293881035.dkr.ecr.us-west-2.amazonaws.com
  EKS_CLUSTER_NAME: Siva-cluster
  HELM_RELEASE_NAME: ev-bharat
  HELM_CHART_PATH: .
  NAMESPACE: ev

jobs:
  build:
    runs-on: ubuntu-latest
    steps:

      - uses: actions/checkout@v6

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v6.3.0
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-west-2

      - name: Login to Amazon ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          push: true
          tags: ${{ steps.ecr.outputs.registry }}/siva-k8sproject:${{ github.sha }}

  deploy:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Checkout source code
        uses: actions/checkout@v6
        
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v6.3.0
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-west-2

      - name: login into the cluster
        run: |
          aws eks update-kubeconfig --region us-west-2 --name Siva-cluster

      - name: replacing the image-id with github.sha
        run: |
          sed -i "s|IMAGE_TAG|${{ github.sha }}|g" K8s/deployment.yaml

      - name: helm upgrade
        run: |
          helm upgrade --install $HELM_RELEASE_NAME $HELM_CHART_PATH --namespace $NAMESPACE --set image.tag=${{ github.sha }} --wait --timeout 2m
